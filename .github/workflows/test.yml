name: Test

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        editor: [vim, neovim]
    steps:
      - uses: actions/checkout@v4

      - name: Setup editor
        uses: rhysd/action-setup-vim@v1
        with:
          version: stable
          neovim: ${{ matrix.editor == 'neovim' }}

      - name: Run tests (Vim primary; user works exclusively in Vim, Neovim for compat)
        run: |
          make ci-test
        env:
          VIM: ${{ matrix.editor }}

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.editor }}
          path: |
            /tmp/*.log
