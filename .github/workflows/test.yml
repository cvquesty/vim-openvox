name: Test

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        editor: [vim, neovim]
    steps:
      - uses: actions/checkout@v4

      - name: Setup editor
        uses: rhysd/action-setup-vim@v1
        with:
          vim-version: stable
          neovim-version: stable

      - name: Run tests (Vim primary; user works exclusively in Vim, Neovim for compat)
        run: |
          make ci-test

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.editor }}
          path: |
            /tmp/*.log
