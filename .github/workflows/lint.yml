name: Lint

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vint
        run: |
          # vint still imports pkg_resources; setuptools 82+ dropped it
          pip install --upgrade pip 'setuptools>=68,<81' wheel
          pip install vim-vint

      - name: Run lint
        run: |
          make lint
