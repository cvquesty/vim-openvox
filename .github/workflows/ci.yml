name: CI (deprecated - see lint.yml and test.yml)

on: [push, pull_request]

# Deprecated: Evolved into separate lint.yml (vint/make lint) and test.yml (matrix + make ci-test).
# Old logic preserved for transition; will be removed in M4.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vint
        run: |
          pip install --upgrade pip
          pip install vim-vint

      - name: Run vint (style check)
        run: |
          vint --style . --verbose || true
          vint --style . 2>&1 | tee vint.log
          if grep -q "error" vint.log; then
            echo "Vint found errors"
            exit 1
          fi
        continue-on-error: false

