name: CI

# Retired. Canonical checks are lint.yml (vint) and test.yml (Vim/Neovim).
# This workflow stays so existing shields.io badges that target ci.yml keep
# resolving. It does not re-run vint — that lives in lint.yml.
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  redirect:
    name: Retired — see lint.yml and test.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm canonical workflows
        run: |
          test -f .github/workflows/lint.yml
          test -f .github/workflows/test.yml
          echo "ci.yml is retired. Use lint.yml and test.yml."
